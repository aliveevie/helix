[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
ffi = false
gas_reports = ["HelixHook", "SettlementRegistry", "CircuitBreaker", "ReputationAccumulator"]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200000

[profile.ci.fuzz]
runs = 4000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.deep.invariant]
runs = 1024
depth = 128

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
